<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จับเวลาออกกำลังกาย</title>
<style>
:root{--bg:#e6ece7;--card:#efece6;--tx:#3d4344;--mu:#80888a;--teal:#8fb5a8;--pink:#e89a9a;--yel:#f0cf8e;--s1:#c5cdc8;--s2:#fbfdfa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#222927;--card:#2b3330;--tx:#e8ece9;--mu:#9aa5a1;--s1:#161b1a;--s2:#363f3c}}
:root[data-theme="dark"]{--bg:#222927;--card:#2b3330;--tx:#e8ece9;--mu:#9aa5a1;--s1:#161b1a;--s2:#363f3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Mali","Sarabun","Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 8px;max-width:520px;width:100%;margin:0 auto}
.c{background:var(--card);border-radius:26px;box-shadow:7px 7px 15px var(--s1),-6px -6px 13px var(--s2);padding:16px;margin-bottom:16px}
.in{background:var(--bg);border:0;border-radius:14px;box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2);color:var(--tx);font:inherit;padding:10px 12px;width:100%}
.btn{border:0;font:inherit;color:var(--tx);background:var(--card);border-radius:999px;padding:12px 20px;box-shadow:5px 5px 11px var(--s1),-4px -4px 9px var(--s2);cursor:pointer}
.btn:active{box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2)}
.btn.p{background:var(--teal);color:#fff}.btn.k{background:var(--pink);color:#fff}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
nav{display:flex;gap:8px;padding:10px 14px 12px;background:var(--bg)}
nav button{flex:1;border:0;font:inherit;font-size:13px;color:var(--mu);background:var(--card);border-radius:18px;padding:10px 4px;box-shadow:4px 4px 9px var(--s1),-3px -3px 7px var(--s2)}
nav button.on{color:var(--tx);box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2)}
.ring{position:relative;width:270px;height:270px;margin:6px auto 14px;border-radius:50%;background:var(--card);box-shadow:9px 9px 20px var(--s1),-8px -8px 18px var(--s2);display:grid;place-items:center}
.ring svg{position:absolute;inset:12px;width:246px;height:246px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
#ph{font-size:20px;letter-spacing:.5px}#tm{font-size:64px;font-weight:300;line-height:1.1}
.mid{text-align:center;position:relative}.sm{font-size:13px;color:var(--mu)}
.chip{display:inline-block;font-size:12px;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--mu);margin:2px}
h2{font-size:17px;margin:0 0 8px;font-weight:600}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--s1)}.li:last-child{border:0}
.x{color:var(--pink);background:none;border:0;font:inherit;padding:6px}
.hide{display:none!important}
.rw{background:var(--bg);border-radius:18px;padding:10px;margin-bottom:10px;box-shadow:inset 3px 3px 6px var(--s1),inset -3px -3px 6px var(--s2)}.rw .in{background:var(--card);padding:8px 10px}.ib{border:0;font:inherit;color:var(--tx);background:var(--card);border-radius:12px;padding:7px 11px;box-shadow:3px 3px 7px var(--s1),-2px -2px 5px var(--s2);flex:0}.ib.d{color:var(--pink)}
</style></head><body>
<main>
<section id="v-timer">
 <div class="c mid" id="setup">
  <label style="margin-top:0">โปรแกรม</label><select id="sel" class="in"></select>
  <div id="sum" class="sm" style="margin:8px 0"></div>
  <label>สถานที่</label><input id="place" class="in" list="pl" placeholder="เช่น บ้าน, สวนสาธารณะ"><datalist id="pl"></datalist>
  <label>เพลงประกอบ (จากเครื่อง)</label>
  <input id="mf" type="file" accept="audio/*" multiple class="hide">
  <div class="row"><button class="btn" id="pick">เลือกเพลง</button><button class="btn hide" id="clr">ล้างเพลง</button></div>
  <div id="mc" class="sm" style="margin-top:6px">ยังไม่ได้เลือกเพลง</div>
 </div>
 <div class="ring"><svg viewBox="0 0 246 246"><circle cx="123" cy="123" r="110" stroke="var(--bg)"/><circle id="arc" cx="123" cy="123" r="110" stroke="var(--teal)" stroke-dasharray="691.2" stroke-dashoffset="0"/></svg>
  <div class="mid"><div id="ph">พร้อมเริ่ม</div><div id="tm">00:00</div><div class="sm" id="tot"></div></div></div>
 <div class="mid sm" id="nx" style="margin-bottom:12px"></div>
 <div class="row"><button class="btn p" id="go">เริ่ม</button><button class="btn hide" id="sk">ข้าม</button><button class="btn k hide" id="st">จบ</button></div>
</section>

<section id="v-prog" class="hide">
 <div id="plist" class="c"></div>
 <div class="c hide" id="ed"></div>
 <button class="btn p" id="new" style="width:100%">+ สร้างโปรแกรมใหม่</button>
</section>

<section id="v-stat" class="hide"><div id="stat"></div></section>

<section id="v-set" class="hide">
 <div class="c"><h2>ข้อมูลส่วนตัว</h2>
  <label>น้ำหนักตัว (กก.) ใช้คำนวณแคลอรี่</label><input id="kg" type="number" class="in" min="20" max="250">
  <h2 style="margin-top:18px">เสียง</h2>
  <label><input type="checkbox" id="vo"> เสียงพูดผู้หญิง (ภาษาไทย)</label>
  <label><input type="checkbox" id="bp"> เสียงบี๊บเตือน</label>
  <label>ความดังเพลง</label><input id="vol" type="range" min="0" max="1" step=".05" style="width:100%">
  <div class="row" style="margin-top:14px"><button class="btn" id="tv">ทดสอบเสียงพูด</button></div>
  <div class="sm" style="margin-top:10px">เสียงพูดใช้ตัวอ่านภาษาไทยของ Android ถ้าไม่ดังให้เช็กว่าติดตั้งข้อมูลเสียงภาษาไทยใน Google Text-to-speech แล้ว</div>
 </div>
</section>
</main>
<nav><button data-t="timer" class="on">จับเวลา</button><button data-t="prog">โปรแกรม</button><button data-t="stat">สถิติ</button><button data-t="set">ตั้งค่า</button></nav>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ACT={'กระโดดเชือก':11.8,'HIIT':8,'วิ่ง':9.8,'ปั่นจักรยาน':7.5,'ว่ายน้ำ':6,'เดินเร็ว':4,'ยกน้ำหนัก':5,'เต้นแอโรบิก':6.5,'มวย/คาร์ดิโอบ็อกซิ่ง':7.8,'โยคะ':2.8,'พิลาทิส':3.5,'เต้นรำ':5.5,'ฟุตบอล/บาสเก็ตบอล':7,'แบดมินตัน':5.5,'กำหนด MET เอง':6};
const LB={warm:'วอร์มอัพ',ex:'ออกกำลัง!',short:'พักสั้น',long:'พักยาว',cool:'คูลดาวน์'};
const EN={warm:'Warm up',ex:'Exercise',short:'Short break',long:'Long break',cool:'Cool down'};
const CL={warm:'var(--yel)',ex:'var(--pink)',short:'var(--teal)',long:'var(--teal)',cool:'var(--yel)'};
const VS={warm:'วอร์มอัพนะ',ex:'เริ่มเลย สู้ๆ',short:'พักก่อนนะ',long:'พักยาวนะ หายใจลึกๆ',cool:'คูลดาวน์เบาๆ'};
let S=ld('hs',{kg:55,vo:true,bp:true,vol:.6}),H=ld('hh',[]);
let P=ld('hp',[{id:1,name:'กระโดดเชือก 60 นาที',act:'กระโดดเชือก',met:11.8,warm:300,work:180,short:50,sets:12,every:4,long:120,cool:180},{id:2,name:'HIIT 20/10',act:'HIIT',met:8,warm:120,work:20,short:10,sets:8,every:0,long:0,cool:60}]);
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const dur=s=>s>=60?Math.floor(s/60)+' นาที'+(s%60?' '+s%60+' วิ':''):s+' วิ';
const metOf=p=>p.act==='กำหนด MET เอง'?p.met:ACT[p.act]||6;
function build(p){if(p.segs){let n=0;return p.segs.map(x=>({t:x.t,d:x.d,n:x.t==='ex'?++n:0}))}return buildOld(p)}
const nEx=p=>build(p).filter(x=>x.t==='ex').length,tot=p=>build(p).reduce((a,x)=>a+x.d,0);
function buildOld(p){const a=[];if(p.warm>0)a.push({t:'warm',d:p.warm});
 for(let i=1;i<=p.sets;i++){a.push({t:'ex',d:p.work,n:i});
  if(i<p.sets){const l=p.every>0&&i%p.every===0&&p.long>0;if(l)a.push({t:'long',d:p.long});else if(p.short>0)a.push({t:'short',d:p.short})}}
 if(p.cool>0)a.push({t:'cool',d:p.cool});return a}
const kcal=(p,list)=>list.reduce((k,x)=>{const m=metOf(p),mt=x.t==='ex'?m:x.t==='warm'?Math.min(m,3.5):x.t==='cool'?Math.min(m,3):2;return k+mt*S.kg*x.s/3600},0);

P.forEach(p=>{if(!p.segs)p.segs=buildOld(p).map(x=>({t:x.t,d:x.d}))});
/* tabs */
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.toggle('on',x===b));
 ['timer','prog','stat','set'].forEach(t=>$('#v-'+t).classList.toggle('hide',t!==b.dataset.t));
 if(b.dataset.t==='stat')rStat();if(b.dataset.t==='prog')rList()});

/* audio */
let AC;const ctx=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function beep(f=880,d=.18,n=1){if(!S.bp)return;try{const c=ctx();for(let i=0;i<n;i++){const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*(d+.08);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}}catch(e){}}
function say(t){if(!S.vo||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';const v=speechSynthesis.getVoices().find(v=>/^th/i.test(v.lang));if(v)u.voice=v;u.pitch=1.8;u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
if(window.speechSynthesis)speechSynthesis.getVoices();
/* music */
const au=new Audio();let tr=[],ti=0;
$('#pick').onclick=()=>$('#mf').click();
$('#mf').onchange=e=>{tr.forEach(t=>URL.revokeObjectURL(t.u));tr=[...e.target.files].map(f=>({n:f.name.replace(/\.[^.]+$/,''),u:URL.createObjectURL(f)}));ti=0;mc()};
$('#clr').onclick=()=>{tr=[];$('#mf').value='';mc()};
function mc(){$('#mc').textContent=tr.length?'เลือกแล้ว '+tr.length+' เพลง: '+tr.map(t=>t.n).slice(0,2).join(', ')+(tr.length>2?'…':''):'ยังไม่ได้เลือกเพลง';$('#clr').classList.toggle('hide',!tr.length)}
au.onended=()=>{if(tr.length){ti=(ti+1)%tr.length;au.src=tr[ti].u;au.play().catch(()=>{})}};
const mplay=()=>{if(!tr.length)return;au.volume=S.vol;if(!au.src||au.ended)au.src=tr[ti].u;au.play().catch(()=>{})};
/* wake lock */
let wl;const lock=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(run&&document.visibilityState==='visible')lock()});

/* timer */
let run=false,pause=false,segs=[],idx=0,end=0,left=0,warned=false,done=[],cur,t0,iv;
function enter(i){idx=i;const g=segs[i];end=Date.now()+g.d*1000;warned=false;
 $('#ph').textContent=EN[g.t]+(g.t==='ex'?' '+g.n+'/'+segs.filter(x=>x.t==='ex').length:'');$('#ph').style.color=CL[g.t];$('#arc').style.stroke=CL[g.t];
 const n=segs[i+1];$('#nx').textContent=n?'ต่อไป: '+LB[n.t]+' '+dur(n.d):'ช่วงสุดท้าย';
 beep(988,.15,2);say(VS[g.t])}
function tick(){if(pause)return;const g=segs[idx],ms=end-Date.now(),r=Math.ceil(ms/1000);
 $('#tm').textContent=mmss(r);$('#arc').style.strokeDashoffset=691.2*(1-Math.max(0,ms)/(g.d*1000));
 const rest=segs.slice(idx+1).reduce((a,x)=>a+x.d,0)+Math.max(0,ms)/1000;$('#tot').textContent='เหลือทั้งหมด '+mmss(rest);
 if(r<=10&&r>0&&!warned&&g.d>12){warned=true;beep(660,.2);say('อีกสิบวินาที')}
 if(ms<=0){done.push({t:g.t,s:g.d});beep(523,.35);idx+1<segs.length?enter(idx+1):finish(true)}}
function start(){cur=P.find(p=>p.id==$('#sel').value);if(!cur)return;segs=build(cur);if(!segs.length)return;done=[];run=true;pause=false;t0=Date.now();
 try{ctx().resume()}catch(e){}mplay();lock();ui(true);enter(0);iv=setInterval(tick,200);tick()}
function ui(on){$('#setup').classList.toggle('hide',on);['sk','st'].forEach(i=>$('#'+i).classList.toggle('hide',!on));$('#go').textContent=on?'พัก':'เริ่ม'}
$('#go').onclick=()=>{if(!run)return start();
 if(!pause){pause=true;left=end-Date.now();au.pause();$('#go').textContent='ต่อ'}else{pause=false;end=Date.now()+left;mplay();$('#go').textContent='พัก'}};
$('#sk').onclick=()=>{if(!run||pause)return;const g=segs[idx];done.push({t:g.t,s:Math.round(g.d-(end-Date.now())/1000)});idx+1<segs.length?enter(idx+1):finish(true)};
let stT=0;$('#st').onclick=()=>{if(!run)return;if(!stT){$('#st').textContent='กดอีกครั้งเพื่อจบ';stT=setTimeout(()=>{stT=0;$('#st').textContent='จบ'},3000);return}clearTimeout(stT);stT=0;$('#st').textContent='จบ';const g=segs[idx],rem=pause?left:end-Date.now();done.push({t:g.t,s:Math.max(0,Math.round(g.d-rem/1000))});finish(false)};
function finish(ok){clearInterval(iv);run=false;au.pause();try{wl&&wl.release()}catch(e){}
 const secs=done.reduce((a,x)=>a+x.s,0),k=Math.round(kcal(cur,done));
 if(secs>=10){H.unshift({id:Date.now(),prog:cur.name,act:cur.act,at:Date.now(),secs,kcal:k,place:$('#place').value.trim(),ok});sv('hh',H);if($('#place').value.trim())sv('hpl',[...new Set([$('#place').value.trim(),...ld('hpl',[])])].slice(0,15))}
 ui(false);$('#ph').textContent=ok?'สุดยอด!':'จบแล้ว';$('#ph').style.color='var(--pink)';$('#tm').textContent=mmss(secs);$('#tot').textContent='ใช้เวลา '+dur(secs)+' · ประมาณ '+k+' กิโลแคลอรี่';$('#nx').textContent='';$('#arc').style.strokeDashoffset=0;
 if(ok){beep(784,.2,3);setTimeout(()=>say('สุดยอด ทำสำเร็จแล้ว'),900)}pl()}
function pl(){$('#pl').innerHTML=ld('hpl',[]).map(p=>'<option value="'+p.replace(/"/g,'&quot;')+'">').join('')}

/* programs */
function rSel(){const v=$('#sel').value;$('#sel').innerHTML=P.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('');if(P.some(p=>p.id==v))$('#sel').value=v;rSum()}
function rSum(){const p=P.find(p=>p.id==$('#sel').value);if(!p){$('#sum').textContent='ยังไม่มีโปรแกรม ไปแท็บโปรแกรมเพื่อสร้าง';return}
 const tot=build(p).reduce((a,x)=>a+x.d,0);$('#sum').innerHTML='<span class="chip">'+p.act+'</span><span class="chip">รวม '+dur(tot)+'</span><span class="chip">'+nEx(p)+' เซ็ต</span>'}
$('#sel').onchange=rSum;
function rList(){$('#ed').classList.add('hide');$('#plist').classList.remove('hide');
 $('#plist').innerHTML='<h2>โปรแกรมของฉัน</h2>'+(P.map(p=>'<div class="li"><div><b>'+p.name+'</b><div class="sm">'+p.act+' · '+nEx(p)+' เซ็ต · รวม '+dur(tot(p))+'</div></div><div><button class="x" style="color:var(--teal)" data-e="'+p.id+'">แก้ไข</button><button class="x" data-d="'+p.id+'">ลบ</button></div></div>').join('')||'<div class="sm">ยังไม่มีโปรแกรม</div>');
 $$('[data-e]').forEach(b=>b.onclick=()=>edit(P.find(p=>p.id==b.dataset.e)));
 $$('[data-d]').forEach(b=>b.onclick=()=>{if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='ยืนยันลบ';setTimeout(()=>{b.dataset.c='';b.textContent='ลบ'},3000);return}P=P.filter(p=>p.id!=b.dataset.d);sv('hp',P);rList();rSel()})}
const ms=(id,l,v)=>'<label>'+l+'</label><div class="row"><input id="'+id+'m" type="number" min="0" class="in" value="'+Math.floor(v/60)+'"><span class="sm" style="flex:0">นาที</span><input id="'+id+'s" type="number" min="0" max="59" class="in" value="'+v%60+'"><span class="sm" style="flex:0">วิ</span></div>';
const gv=id=>(+$('#'+id+'m').value||0)*60+(+$('#'+id+'s').value||0);
function edit(p){const n=!p;p=p||{id:Date.now(),name:'',act:'กระโดดเชือก',met:6,target:0,segs:[{t:'warm',d:300},{t:'ex',d:180},{t:'short',d:50},{t:'ex',d:180},{t:'short',d:50},{t:'ex',d:180},{t:'cool',d:180}]};
 let rows=p.segs.map(x=>({t:x.t,d:x.d}));
 $('#plist').classList.add('hide');const e=$('#ed');e.classList.remove('hide');
 e.innerHTML='<h2>'+(n?'โปรแกรมใหม่':'แก้ไขโปรแกรม')+'</h2><label>ชื่อโปรแกรม</label><input id="en" class="in" value="'+p.name.replace(/"/g,'&quot;')+'">'+
 '<label>ประเภทการออกกำลังกาย (ใช้คำนวณแคลอรี่)</label><select id="ea" class="in">'+Object.keys(ACT).map(a=>'<option'+(a===p.act?' selected':'')+'>'+a+'</option>').join('')+'</select>'+
 '<div id="em" class="'+(p.act==='กำหนด MET เอง'?'':'hide')+'"><label>ค่า MET (เดิน≈3.5 วิ่ง≈10 หนักมาก≈12+)</label><input id="emv" type="number" step=".1" class="in" value="'+p.met+'"></div>'+
 ms('et','เวลาทั้งหมดที่ตั้งใจ (ไม่บังคับ ไว้เทียบกับผลรวม)',p.target||0)+
 '<label style="margin-top:16px">ช่วงเวลาของโปรแกรม เรียงตามลำดับ</label><div id="rw"></div>'+
 '<div style="margin:6px 0 4px">'+Object.keys(LB).map(k=>'<button class="btn" style="padding:8px 12px;margin:3px;font-size:13px" data-add="'+k+'">+ '+LB[k]+'</button>').join('')+'</div>'+
 '<div class="c" id="tt" style="margin:12px 0;text-align:center;padding:12px"></div>'+
 '<div class="row"><button class="btn" id="ecx">ยกเลิก</button><button class="btn p" id="esv">บันทึก</button></div>';
 const tl=()=>{const t=rows.reduce((a,r)=>a+r.d,0),g=gv('et'),ne=rows.filter(r=>r.t==='ex').length;
  $('#tt').innerHTML='รวมทั้งหมด <b>'+mmss(t)+'</b> <span class="sm">('+ne+' เซ็ต)</span>'+(g?'<div class="sm">เป้า '+mmss(g)+' · '+(t<g?'ยังขาดอีก '+dur(g-t):t>g?'เกินเป้า '+dur(t-g):'ตรงเป้าพอดี')+'</div>':'')};
 const rr=()=>{let k=0;$('#rw').innerHTML=rows.map((r,i)=>{if(r.t==='ex')k++;return '<div class="rw"><div class="row"><span class="sm" style="flex:0;white-space:nowrap">'+(i+1)+'.'+(r.t==='ex'?' เซ็ต '+k:'')+'</span><select class="in" data-i="'+i+'" data-k="t">'+Object.keys(LB).map(x=>'<option value="'+x+'"'+(x===r.t?' selected':'')+'>'+LB[x]+'</option>').join('')+'</select></div>'+
  '<div class="row" style="margin-top:8px"><input type="number" min="0" class="in" data-i="'+i+'" data-k="m" value="'+Math.floor(r.d/60)+'"><span class="sm" style="flex:0">นาที</span><input type="number" min="0" max="59" class="in" data-i="'+i+'" data-k="s" value="'+r.d%60+'"><span class="sm" style="flex:0">วิ</span></div>'+
  '<div class="row" style="margin-top:8px;justify-content:flex-end"><button class="ib" data-a="up" data-i="'+i+'">▲</button><button class="ib" data-a="dn" data-i="'+i+'">▼</button><button class="ib" data-a="dup" data-i="'+i+'">คัดลอก</button><button class="ib d" data-a="del" data-i="'+i+'">ลบ</button></div></div>'}).join('')||'<div class="sm">ยังไม่มีช่วง กดปุ่มด้านล่างเพื่อเพิ่ม</div>';tl()};
 const rw=$('#rw');
 rw.oninput=ev=>{const el=ev.target,i=+el.dataset.i,k=el.dataset.k;if(k!=='m'&&k!=='s')return;const r=rw.querySelectorAll('[data-i="'+i+'"]');rows[i].d=(+r[1].value||0)*60+(+r[2].value||0);tl()};
 rw.onchange=ev=>{const el=ev.target;if(el.dataset.k==='t'){rows[+el.dataset.i].t=el.value;rr()}};
 rw.onclick=ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const i=+b.dataset.i,a=b.dataset.a;
  if(a==='del')rows.splice(i,1);else if(a==='dup')rows.splice(i+1,0,{...rows[i]});
  else if(a==='up'&&i>0)[rows[i-1],rows[i]]=[rows[i],rows[i-1]];else if(a==='dn'&&i<rows.length-1)[rows[i+1],rows[i]]=[rows[i],rows[i+1]];rr()};
 $$('[data-add]').forEach(b=>b.onclick=()=>{const t=b.dataset.add,d={warm:300,ex:180,short:50,long:120,cool:180}[t];rows.push({t,d});rr();rw.lastElementChild&&rw.lastElementChild.scrollIntoView({block:'center'})});
 $('#etm').oninput=$('#ets').oninput=tl;
 $('#ea').onchange=()=>$('#em').classList.toggle('hide',$('#ea').value!=='กำหนด MET เอง');
 $('#ecx').onclick=rList;
 $('#esv').onclick=()=>{const segs=rows.filter(r=>r.d>0);if(!segs.length){$('#tt').innerHTML='<span style="color:var(--pink)">เพิ่มอย่างน้อย 1 ช่วงที่มีเวลา</span>';return}
  const q={id:p.id,name:$('#en').value.trim()||'โปรแกรมไม่มีชื่อ',act:$('#ea').value,met:+($('#emv')||{}).value||6,target:gv('et'),segs};
  const i=P.findIndex(x=>x.id===p.id);i>=0?P[i]=q:P.push(q);sv('hp',P);rList();rSel()};
 rr()}
$('#new').onclick=()=>edit();

/* stats */
function rStat(){const now=new Date(),wk=Date.now()-7*864e5,mo=new Date(now.getFullYear(),now.getMonth(),1).getTime();
 const agg=f=>{const a=H.filter(h=>h.at>=f);return{n:a.length,m:Math.round(a.reduce((s,h)=>s+h.secs,0)/60),k:a.reduce((s,h)=>s+h.kcal,0)}};
 const w=agg(wk),m=agg(mo),by={};H.forEach(h=>{const b=by[h.prog]||(by[h.prog]={n:0,s:0,k:0});b.n++;b.s+=h.secs;b.k+=h.kcal});
 const box=(t,o)=>'<div class="c" style="flex:1;text-align:center;padding:12px"><div class="sm">'+t+'</div><div style="font-size:24px">'+o.m+'<span class="sm"> นาที</span></div><div class="sm">'+o.n+' ครั้ง · '+o.k+' kcal</div></div>';
 $('#stat').innerHTML='<div class="row" style="align-items:stretch">'+box('7 วันล่าสุด',w)+box('เดือนนี้',m)+'</div>'+
 '<div class="c"><h2>แยกตามโปรแกรม</h2>'+(Object.keys(by).map(k=>'<div class="li"><span>'+k+'</span><span class="sm">'+by[k].n+' ครั้ง · '+Math.round(by[k].s/60)+' นาที · '+by[k].k+' kcal</span></div>').join('')||'<div class="sm">ยังไม่มีข้อมูล เริ่มออกกำลังกายครั้งแรกได้เลย</div>')+'</div>'+
 '<div class="c"><h2>ประวัติ</h2>'+(H.map(h=>'<div class="li"><div><b>'+h.prog+'</b>'+(h.ok?'':' <span class="sm">(จบก่อน)</span>')+'<div class="sm">'+new Date(h.at).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})+(h.place?' · '+h.place:'')+'</div></div><div style="text-align:right"><div>'+dur(h.secs)+'</div><div class="sm">~'+h.kcal+' kcal</div></div><button class="x" data-h="'+h.id+'">ลบ</button></div>').join('')||'<div class="sm">ว่างอยู่</div>')+'</div>';
 $$('[data-h]').forEach(b=>b.onclick=()=>{H=H.filter(h=>h.id!=b.dataset.h);sv('hh',H);rStat()})}

/* settings */
$('#kg').value=S.kg;$('#vo').checked=S.vo;$('#bp').checked=S.bp;$('#vol').value=S.vol;
$('#kg').onchange=()=>{S.kg=+$('#kg').value||55;sv('hs',S)};
$('#vo').onchange=()=>{S.vo=$('#vo').checked;sv('hs',S)};$('#bp').onchange=()=>{S.bp=$('#bp').checked;sv('hs',S)};
$('#vol').oninput=()=>{S.vol=+$('#vol').value;au.volume=S.vol;sv('hs',S)};
$('#tv').onclick=()=>say('สุดยอด ทำสำเร็จแล้ว');
rSel();pl();
</script></body></html>
